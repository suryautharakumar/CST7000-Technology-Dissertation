{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2>Select Target Column</h2>
                <p class="text-muted">The target column is the value that the system will predict.</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Target Column</label>
                        <select name="target_column" class="form-select form-select-lg" required>
                            <option value="">-- Select target column --</option>
                            {% for col in columns %}
                                <option value="{{ col }}">{{ col }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Confirm Target</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
